<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>sc player 2.0 — living prototype</title>
<!--
  The 2.0 redesign as a living prototype (not app code): ?screen=home|full|custom|workshop|inbox|send
  - live:   npx electron design/redesign/proto.cjs <screen>  → plays a track, everything reacts through an AnalyserNode
  - render: video.cjs calls __frame(n) with the bands precomputed by analyze.mjs (audio-data.js), frame by frame
  Strict style: small radii, medium weights, one quiet accent (taken from the background) used only where it means
  something (progress, the playing item, the active page). The background is the cover's palette poured into a slowly
  warping noise field (domain-warped fbm, a public technique, written from scratch), drawn small, blown up blurred,
  kept dim. Made-up tracks, people and generated covers only.
-->
<link rel="stylesheet" href="../../node_modules/@fontsource/onest/400.css" />
<link rel="stylesheet" href="../../node_modules/@fontsource/onest/500.css" />
<link rel="stylesheet" href="../../node_modules/@fontsource/onest/600.css" />
<link rel="stylesheet" href="../../node_modules/@fontsource/onest/700.css" />
<script src="audio-data.js"></script>
<style>
  :root {
    --accent: #e0705f; --accent-rgb: 224, 112, 95; --on-accent: #120605;
    --text: #ececef; --muted: #9b9ba4; --dim: #64646c; --faint: #3a3a41;
    --glass-a: 0.58; --glass: rgba(14, 14, 17, var(--glass-a)); --bg-blur: 14px; --veil: 0.72; --line: rgba(255, 255, 255, 0.075); --line2: rgba(255, 255, 255, 0.12);
    --hover: rgba(255, 255, 255, 0.045); --sel: rgba(255, 255, 255, 0.07);
    --blur: 30px; --r: 10px; --r2: 7px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 800px; overflow: hidden; background: #050506; }
  body { font-family: Onest, system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; font-size: 13px; font-weight: 500; letter-spacing: -0.003em; }
  svg { display: block; }

  /* ── background ── */
  #bg { position: fixed; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); filter: blur(var(--bg-blur)) saturate(1.1); }
  #custom { position: fixed; inset: -30px; width: calc(100% + 60px); height: calc(100% + 60px); object-fit: cover; display: none; opacity: 0.85; filter: blur(var(--bg-blur)); }
  .custom #custom { display: block; }
  .custom #bg { display: none; }
  .veil { position: fixed; inset: 0; pointer-events: none;
          background: radial-gradient(120% 100% at 50% 35%, rgba(5, 5, 6, 0.35), rgba(5, 5, 6, 1)); opacity: var(--veil); }
  /* very clear glass: the text gets a soft shadow so it stays readable on any background */
  body.thin .glass { text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7); }
  body.lite .glass { backdrop-filter: none; }
  .grain { position: fixed; inset: 0; pointer-events: none; opacity: 0.05; mix-blend-mode: overlay;
           background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  .glass { background: var(--glass); backdrop-filter: blur(var(--blur)) saturate(1.2); border: 1px solid var(--line); }
  .ico { width: 17px; height: 17px; color: var(--muted); flex: none; }
  .ico.sm { width: 14px; height: 14px; }
  .acc { color: var(--accent); }
  .lbl { font-size: 10.5px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
  .num { font-variant-numeric: tabular-nums; }
  img.cv { display: block; object-fit: cover; }

  /* ── shell ── */
  .app { position: fixed; inset: 0; display: grid; grid-template-columns: 236px 1fr 288px; grid-template-rows: 44px 1fr 84px; gap: 8px; padding: 0 8px 8px; }
  .app.two { grid-template-columns: 236px 1fr; }
  .tb { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; margin-bottom: -8px; }
  .brand { display: flex; align-items: center; gap: 9px; width: 228px; font-weight: 600; font-size: 13px; padding-left: 8px; letter-spacing: 0; }
  .mark { width: 18px; height: 18px; border-radius: 5px; background: var(--text); display: grid; place-items: center; }
  .mark i { width: 7px; height: 7px; border-radius: 50%; background: #0b0b0d; }
  .hist { display: flex; gap: 2px; }
  .hist span { width: 28px; height: 28px; border-radius: var(--r2); display: grid; place-items: center; }
  .search { width: 400px; height: 30px; border-radius: var(--r2); display: flex; align-items: center; gap: 9px; padding: 0 10px; color: var(--dim); font-size: 12.5px; }
  .search kbd { margin-left: auto; font: 500 10.5px Onest; color: var(--dim); border: 1px solid var(--line2); border-radius: 4px; padding: 1px 5px; }
  .tb .right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .stat { height: 28px; padding: 0 10px; border-radius: var(--r2); display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted); }
  .stat i { width: 6px; height: 6px; border-radius: 50%; background: #4fc27a; }
  .ibtn { position: relative; width: 30px; height: 30px; border-radius: var(--r2); display: grid; place-items: center; }
  .ibtn b { position: absolute; top: 4px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px #0e0e11; }
  .wc { display: flex; margin-left: 4px; }
  .wc span { width: 40px; height: 32px; display: grid; place-items: center; color: var(--dim); font-size: 11px; }

  .side { border-radius: var(--r); padding: 10px 8px; display: flex; flex-direction: column; overflow: hidden; }
  .nav { position: relative; display: flex; align-items: center; gap: 11px; height: 32px; padding: 0 10px; border-radius: var(--r2); color: var(--muted); font-size: 13px; }
  .nav.on { color: var(--text); background: var(--sel); }
  .nav.on::before { content: ""; position: absolute; left: -8px; top: 8px; bottom: 8px; width: 2px; border-radius: 1px; background: var(--accent); }
  .nav.on .ico { color: var(--text); }
  .nav .n { margin-left: auto; font-size: 11px; color: var(--dim); }
  .nav .u { margin-left: auto; min-width: 18px; height: 16px; border-radius: 4px; padding: 0 5px; font-size: 10.5px; font-weight: 600; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); }
  .sect { display: flex; align-items: center; margin: 16px 10px 6px; }
  .sect .ico { margin-left: auto; width: 13px; height: 13px; color: var(--dim); }
  .pin { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 6px; border-radius: var(--r2); }
  .pin.on { background: var(--hover); }
  .pin img { width: 28px; height: 28px; border-radius: 4px; }
  .pin .t { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pin.on .t { color: var(--text); }
  .pin .s { font-size: 11px; color: var(--dim); margin-top: 1px; }
  .eq { margin-left: auto; display: flex; align-items: flex-end; gap: 2px; height: 11px; }
  .eq i { width: 2px; background: var(--accent); }
  .me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 6px 0; border-top: 1px solid var(--line); }
  .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; color: #0d0d10; flex: none; }
  .me .t { font-weight: 600; font-size: 12.5px; }
  .me .s { color: var(--dim); font-size: 11px; }
  .me .ico { margin-left: auto; }

  .main { overflow: hidden; padding: 4px 8px 0; position: relative; }
  .ph { display: flex; align-items: flex-end; gap: 12px; margin: 10px 0 16px; }
  .ph h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
  .ph p { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .seg { display: flex; padding: 2px; border-radius: var(--r2); border: 1px solid var(--line); background: rgba(0,0,0,0.15); }
  .seg span { height: 24px; padding: 0 10px; border-radius: 5px; display: grid; place-items: center; font-size: 11.5px; color: var(--muted); }
  .seg span.on { background: var(--sel); color: var(--text); }
  .rh { display: flex; align-items: baseline; margin: 0 0 10px; }
  .rh h2 { font-size: 14px; font-weight: 600; }
  .rh a { margin-left: auto; font-size: 11.5px; color: var(--dim); }

  .dial { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 24px; }
  .tile { position: relative; display: flex; align-items: center; gap: 12px; height: 52px; border-radius: var(--r2); overflow: hidden; padding-right: 12px; background: rgba(255,255,255,0.035); border: 1px solid var(--line); }
  .tile img { width: 52px; height: 52px; }
  .tile .t { font-size: 13px; font-weight: 600; }
  .tile .s { font-size: 11.5px; color: var(--dim); margin-top: 1px; }
  .tile .pp { margin-left: auto; width: 28px; height: 28px; border-radius: 50%; background: var(--text); display: grid; place-items: center; }
  .tile .pp .ico { color: #0b0b0d; }
  .tile .bar { position: absolute; left: 52px; right: 0; bottom: 0; height: 2px; background: rgba(255,255,255,0.06); }
  .tile .bar i { display: block; height: 100%; background: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 24px; }
  .card .cvw2 { position: relative; aspect-ratio: 1; border-radius: var(--r2); overflow: hidden; }
  .card .cvw2 img { width: 100%; height: 100%; }
  .card .pp { position: absolute; right: 8px; bottom: 8px; width: 32px; height: 32px; border-radius: 50%; background: var(--text); display: grid; place-items: center; opacity: 0; }
  .card .pp .ico { color: #0b0b0d; }
  .card.hover .pp { opacity: 1; }
  .card .t { font-size: 12.5px; font-weight: 600; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .s { font-size: 11.5px; color: var(--dim); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font-size: 9.5px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); border: 1px solid var(--line2); border-radius: 3px; padding: 0 4px; margin-left: 6px; vertical-align: 1px; }
  table.tr { width: 100%; border-collapse: collapse; }
  .tr td { height: 44px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .tr td.n { width: 30px; color: var(--dim); font-size: 11.5px; }
  .tr td.c { width: 44px; }
  .tr td.c img { width: 32px; height: 32px; border-radius: 4px; }
  .tr td .t { font-weight: 600; }
  .tr td .s { color: var(--dim); font-size: 11.5px; margin-top: 1px; }
  .tr td.m { color: var(--muted); width: 180px; }
  .tr td.d { color: var(--dim); text-align: right; width: 50px; }
  .tr tr.on .t { color: var(--accent); }

  .queue { border-radius: var(--r); padding: 12px 10px; display: flex; flex-direction: column; overflow: hidden; }
  .qh { display: flex; align-items: center; margin: 0 4px 10px; }
  .qh b { font-size: 13px; font-weight: 600; }
  .qh .seg { margin-left: auto; }
  .np { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: var(--r2); background: var(--hover); border: 1px solid var(--line); }
  .np img { width: 44px; height: 44px; border-radius: 4px; }
  .np .t { font-weight: 600; font-size: 13px; }
  .np .s { color: var(--dim); font-size: 11.5px; margin-top: 1px; }
  .np .from { margin-bottom: 3px; }
  .qsub { display: flex; margin: 16px 6px 4px; }
  .qsub span { margin-left: auto; font-size: 11px; color: var(--dim); letter-spacing: 0; text-transform: none; }
  .qi { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 6px; border-radius: var(--r2); }
  .qi.hover { background: var(--hover); }
  .qi img { width: 28px; height: 28px; border-radius: 4px; }
  .qi .t { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qi .s { font-size: 11px; color: var(--dim); }
  .qi .d { margin-left: auto; font-size: 11px; color: var(--dim); }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-top: 1px solid var(--line); margin-top: auto; }
  .row .t { font-size: 12.5px; font-weight: 600; }
  .row .s { font-size: 11px; color: var(--dim); }
  .sw { margin-left: auto; width: 28px; height: 16px; border-radius: 8px; background: var(--text); position: relative; flex: none; }
  .sw::after { content: ""; position: absolute; right: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: #0b0b0d; }
  .sw.offsw { background: var(--faint); }
  .sw.offsw::after { right: auto; left: 2px; background: var(--muted); }

  .player { grid-column: 1 / -1; border-radius: var(--r); display: grid; grid-template-columns: 300px minmax(0, 1fr) 300px; align-items: center; padding: 0 16px 0 14px; gap: 20px; }
  .now { display: flex; align-items: center; gap: 22px; min-width: 0; padding-left: 6px; }
  .cvw { position: relative; width: 52px; height: 52px; flex: none; }
  .cvw img { position: absolute; inset: 0; width: 52px; height: 52px; border-radius: 5px; }
  .cvw canvas { position: absolute; left: -24px; top: -24px; width: 100px; height: 100px; pointer-events: none; }
  .now .t { font-size: 13.5px; font-weight: 600; }
  .now .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .now .like { color: var(--accent); margin-left: auto; }
  .mid { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
  .ctrl { display: flex; align-items: center; gap: 22px; }
  .ctrl .on { color: var(--text); }
  .ctrl .pp { width: 34px; height: 34px; border-radius: 50%; background: var(--text); display: grid; place-items: center; }
  .ctrl .pp .ico { color: #0b0b0d; }
  .prog { width: 100%; max-width: 560px; display: flex; align-items: center; gap: 10px; font-size: 10.5px; color: var(--dim); }
  .prog canvas { flex: 1; min-width: 0; width: 100%; height: 24px; }
  .rt { display: flex; justify-content: flex-end; align-items: center; gap: 14px; }
  .rt .on { color: var(--text); }
  .vol { display: flex; align-items: center; gap: 8px; }
  .vol .track { width: 80px; height: 3px; border-radius: 2px; background: var(--faint); position: relative; }
  .vol .track i { position: absolute; left: 0; top: 0; bottom: 0; width: 66%; border-radius: 2px; background: var(--muted); }

  /* ── fullscreen ── */
  .full { position: fixed; inset: 0; }
  .ftb { position: absolute; top: 0; left: 0; right: 0; height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 14px; }
  .from { height: 28px; padding: 0 10px 0 4px; border-radius: var(--r2); display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); }
  .from img { width: 20px; height: 20px; border-radius: 3px; }
  .from b { color: var(--text); font-weight: 600; }
  .stage { position: absolute; inset: 48px 0 0 0; display: grid; grid-template-columns: 620px 1fr; padding: 0 60px 0 0; }
  .left { position: relative; display: flex; flex-direction: column; align-items: center; }
  .halo { position: relative; width: 620px; height: 500px; margin-top: -24px; }
  .halo canvas { position: absolute; inset: 0; width: 620px; height: 500px; }
  .halo img { position: absolute; left: 170px; top: 110px; width: 280px; height: 280px; border-radius: 8px; box-shadow: 0 30px 70px rgba(0,0,0,0.55); }
  .meta { width: 380px; display: flex; align-items: flex-end; gap: 10px; margin-top: -18px; }
  .meta .t { font-size: 22px; font-weight: 600; letter-spacing: -0.015em; }
  .meta .s { font-size: 14px; color: var(--muted); margin-top: 3px; }
  .meta .like { margin-left: auto; color: var(--accent); }
  .fprog { width: 380px; margin-top: 16px; }
  .fprog canvas { width: 380px; height: 30px; }
  .fprog .tt { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); margin-top: 4px; }
  .fctrl { width: 380px; display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .fctrl .ico { width: 20px; height: 20px; }
  .fctrl .pp { width: 52px; height: 52px; border-radius: 50%; background: var(--text); display: grid; place-items: center; }
  .fctrl .pp .ico { color: #0b0b0d; width: 22px; height: 22px; }
  .lyrics { position: relative; overflow: hidden; height: 652px; margin-top: 20px;
            -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 24%, #000 70%, transparent 100%); }
  .lyrics .roll { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; gap: 22px; }
  .ln { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; color: rgba(255,255,255,0.26); }
  .ln.near { filter: blur(0.5px); }
  .ln.far { filter: blur(1.6px); color: rgba(255,255,255,0.15); }
  .ln.on { color: rgba(255,255,255,0.28); }
  .ln.on .w { background-clip: text; -webkit-background-clip: text; color: transparent; }
  .ln .ins { font-size: 12px; font-weight: 600; letter-spacing: 0.16em; color: var(--dim); text-transform: uppercase; }
  .dock { position: absolute; right: 14px; bottom: 14px; display: flex; gap: 2px; padding: 3px; border-radius: var(--r); }
  .dock span { height: 28px; padding: 0 11px; display: flex; align-items: center; gap: 7px; border-radius: var(--r2); font-size: 12px; color: var(--muted); }
  .dock span .ico { width: 14px; height: 14px; }
  .dock span.on { background: var(--sel); color: var(--text); }
  .dock span.on .ico { color: var(--text); }
  .src { position: absolute; left: 24px; bottom: 20px; font-size: 11px; color: var(--dim); display: flex; gap: 6px; align-items: center; }

  .pop { position: absolute; border-radius: var(--r); padding: 8px; box-shadow: 0 24px 60px rgba(0,0,0,0.5); }
  .pop .lbl { margin: 6px 8px 8px; display: block; }
  .opt { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: var(--r2); }
  .opt.on { background: var(--sel); }
  .opt .pv { width: 40px; height: 28px; border-radius: 4px; flex: none; background-size: cover; background-position: center; border: 1px solid var(--line); }
  .opt .t { font-weight: 600; font-size: 12.5px; }
  .opt .s { font-size: 11px; color: var(--dim); margin-top: 1px; }
  .opt .ck { margin-left: auto; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--dim); }
  .opt.on .ck { border-color: var(--text); background: radial-gradient(circle, var(--text) 0 38%, transparent 42%); }
  .sl { padding: 8px 8px 4px; }
  .sl .r { display: flex; font-size: 11.5px; color: var(--muted); }
  .sl .r b { margin-left: auto; color: var(--text); font-weight: 600; }
  .sl .track { height: 3px; border-radius: 2px; background: var(--faint); margin-top: 8px; position: relative; }
  .sl .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--text); }
  .palette { display: flex; gap: 4px; padding: 10px 8px 4px; align-items: center; font-size: 11.5px; color: var(--muted); }
  .palette span { margin-right: auto; }
  .palette i { width: 14px; height: 14px; border-radius: 3px; }

  /* ── appearance: the knobs ── */
  .appear { width: 312px; display: none; }
  .appear.open { display: block; }
  .appear .hd { display: flex; align-items: center; margin: 4px 8px 10px; }
  .appear .hd b { font-size: 13px; font-weight: 600; }
  .appear .hd span { margin-left: auto; font-size: 11px; color: var(--dim); }
  .appear .seg { margin: 0 8px 4px; }
  .appear .seg span { flex: 1; }
  .appear .lbl { margin: 12px 8px 2px; }
  .knob { padding: 7px 8px 3px; }
  .knob .r { display: flex; font-size: 12px; color: var(--muted); }
  .knob .r b { margin-left: auto; color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .knob input { -webkit-appearance: none; appearance: none; width: 100%; height: 16px; background: transparent; margin-top: 4px; cursor: pointer; }
  .knob input::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--text) var(--p, 50%), var(--faint) var(--p, 50%)); }
  .knob input::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; margin-top: -5px; border-radius: 50%; background: var(--text); box-shadow: 0 0 0 3px rgba(0,0,0,0.35); }
  .appear .row { margin-top: 10px; padding: 10px 8px 4px; }
  .appear .foot2 { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 2px; font-size: 11px; color: var(--dim); }
  .appear .foot2 .palette { padding: 0; }

  /* ── workshop ── */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .th { border-radius: var(--r); padding: 6px 6px 9px; border: 1px solid var(--line); background: rgba(255,255,255,0.025); }
  .th.sel { border-color: var(--line2); background: var(--sel); }
  .th .t { font-weight: 600; font-size: 12.5px; margin: 9px 4px 0; display: flex; align-items: center; }
  .th .by { display: flex; align-items: center; gap: 6px; margin: 3px 4px 0; font-size: 11px; color: var(--dim); }
  .th .by .nums { margin-left: auto; display: flex; gap: 8px; }
  .th .by .nums span { display: flex; align-items: center; gap: 3px; }
  .th .by .ico { width: 11px; height: 11px; color: var(--dim); }
  .tp { position: relative; aspect-ratio: 16 / 9.4; border-radius: var(--r2); overflow: hidden; }
  .tp .bgl { position: absolute; inset: 0; }
  .tp .sd { position: absolute; left: 4%; top: 8%; bottom: 23%; width: 18%; border-radius: 3px; padding-top: 2px; }

  while (cs.length < K) { let best = px[0], bd = -1; for (const p of px) { const m = Math.min(...cs.map((c) => dist(p, c))); if (m > bd) { bd = m; best = p; } } cs.push(best); }
  let counts = [];
  for (let it = 0; it < 8; it++) {
    const sum = cs.map(() => [0, 0, 0]); counts = cs.map(() => 0);
    for (const p of px) { let k = 0, bd = Infinity; cs.forEach((c, j) => { const v = dist(p, c); if (v < bd) { bd = v; k = j; } }); sum[k][0] += p[0]; sum[k][1] += p[1]; sum[k][2] += p[2]; counts[k]++; }
    cs.forEach((c, j) => { if (counts[j]) cs[j] = sum[j].map((v) => v / counts[j]); });
  }
  const ranked = cs.map((c, j) => ({ c, n: counts[j], hsl: rgb2hsl(c) })).filter((x) => x.n > 0).sort((a, b) => b.n - a.n);
  const score = (x) => x.hsl[1] * Math.sqrt(x.n) * (1 - Math.abs(x.hsl[2] - 0.5));
  const vivid = [...ranked].sort((a, b) => score(b) - score(a))[0];
  const [h, s] = vivid.hsl;
  const accent = hsl2rgb([h, Math.min(0.62, Math.max(0.42, s)), 0.66]);
  const field = ranked.map((x) => { const [hh, ss, ll] = x.hsl; return hsl2rgb([hh, Math.min(0.8, ss), Math.min(0.5, Math.max(0.14, ll))]); });
  while (field.length < 5) field.push(hsl2rgb([(h + field.length * 0.06) % 1, s * 0.7, 0.25]));
  return { accent, field: field.slice(0, 5) };
}
function applyPalette(pal) {
  const root = document.documentElement.style;
  root.setProperty("--accent", toHex(pal.accent));
  root.setProperty("--accent-rgb", pal.accent.map(Math.round).join(", "));
  root.setProperty("--on-accent", toHex(hsl2rgb([rgb2hsl(pal.accent)[0], 0.5, 0.08])));

}

const bg = document.getElementById("bg");
const gl = bg.getContext("webgl", { preserveDrawingBuffer: true, antialias: false });
bg.width = 264; bg.height = 172;
const FS = `precision highp float;
uniform vec2 res; uniform float t; uniform vec4 band; uniform float high;
uniform vec3 c0, c1, c2, c3, c4;
float hash(vec2 p){ p = fract(p * vec2(443.897, 441.423)); p += dot(p, p.yx + 19.19); return fract((p.x + p.y) * p.x); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * f * (f * (f * 6. - 15.) + 10.);
  return mix(mix(hash(i), hash(i + vec2(1., 0.)), u.x), mix(hash(i + vec2(0., 1.)), hash(i + vec2(1., 1.)), u.x), u.y); }
float fbm(vec2 p){ float a = .5, s = 0.; mat2 m = mat2(1.6, 1.2, -1.2, 1.6); for (int i = 0; i < 5; i++){ s += a * noise(p); p = m * p; a *= .5; } return s; }
void main(){
  vec2 uv = (gl_FragCoord.xy - .5 * res) / res.y;
  float slow = t * .05;
  vec2 q = vec2(fbm(uv * 1.3 + vec2(0., slow)), fbm(uv * 1.3 + vec2(3.1, -slow * 1.3) + band.x * .2));
  float k = 2.3 + band.y * .7;
  vec2 r = vec2(fbm(uv * 1.1 + k * q + vec2(1.7, 9.2) + slow * .7 + band.z * .15),
                fbm(uv * 1.1 + k * q + vec2(8.3, 2.8) - slow * .5 + band.w * .18));
  float f = fbm(uv * 1.2 + (2.1 + band.y * .4) * r);
  vec3 col = mix(c0, c1, smoothstep(.3, .68, f));
  col = mix(col, c2, smoothstep(.48, .88, r.x));
  col = mix(col, c3, smoothstep(.55, .92, q.y) * .8);
  col = mix(col, c4, smoothstep(.62, .95, f * r.y * 1.7) * .6);
  float lum = dot(col, vec3(.3, .59, .11));
  col = mix(vec3(lum), col, .58);
  col *= .5 + .12 * band.y + .04 * high;
  float v = smoothstep(1.3, .2, length(uv * vec2(.82, 1.)));
  col = mix(vec3(.02, .02, .024), col, .2 + .5 * v);

function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, "attribute vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }"));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = (n) => gl.getUniformLocation(prog, n);

  gl.uniform4f(U("band"), b[0], b[1], b[2], b[3]); gl.uniform1f(U("high"), b[4]);

    <div class="acts"><span class="btn pri">Apply</span><span class="btn">Preview</span><span class="btn" style="padding:0 10px">${I("heart", "ico sm")}</span></div>
    <div class="foot"><span>.scptheme · no scripts</span><span>Report</span></div>
  </aside>
  ${player()}
</div>`;
}

/** the Appearance panel: the background (kind, blur, dim, how much it reacts) and the glass panels (opacity, blur) */
function appearance(where) {
  const open = SCREEN === "custom" || SCREEN === "appear";
  const pos = where === "home" ? "left:252px; bottom:100px" : "right:14px; bottom:58px";
  const kind = SCREEN === "custom" ? 2 : 0;
  const knob = (k, label, min, max, unit) => `<div class="knob"><div class="r">${label}<b data-out="${k}"></b></div><input type="range" data-k="${k}" min="${min}" max="${max}" data-unit="${unit}" /></div>`;
  return `<div class="pop glass appear ${open ? "open" : ""}" id="appear" style="${pos}">
    <div class="hd"><b>Appearance</b><span>Theme · Liquid</span></div>
    <span class="lbl" style="margin-top:2px">Background</span>
    <div class="seg">${["Liquid", "Cover", "Your file", "None"].map((x, i) => `<span class="${i === kind ? "on" : ""}">${x}</span>`).join("")}</div>
    ${knob("bgblur", "Blur", 0, 40, "px")}
    ${knob("dim", "Dim", 0, 100, "%")}
    ${knob("react", "Reacts to sound", 0, 100, "%")}
    <span class="lbl">Panels</span>
    ${knob("glass", "Opacity", 10, 100, "%")}
    ${knob("pblur", "Blur behind", 0, 60, "px")}
    <div class="row">${I("sparkle")}<div><div class="t">Lighter effects</div><div class="s">No blur behind panels, for slow PCs</div></div><span class="sw offsw" id="lite"></span></div>
    <div class="foot2"><span>Reset to the theme</span><div class="palette">${"<i></i>".repeat(5)}</div></div>
  </div>`;
}

const LYRICS = [
  ["", 0], ["we left the lights on in the hall", 0.0], ["the city hums a quiet song", 2.4], ["and every street remembers us", 4.7],
  ["the night is long, the night is long", 7.2], ["so turn it up and let it play", 9.6], ["until the morning finds its way", 12.0], ["", 14.4],
];
function full() {
  const [nt, na, nd] = TRACKS[NOW];
  const custom = SCREEN === "custom";
  return `<div class="full">
  <div class="ftb">
    <div class="from glass">${cov(8)}Playing from <b>ночной трамвай</b></div>
    <div style="margin-left:auto; display:flex; gap:6px; align-items:center">
      <span class="btn glass">${I("send", "ico sm")}Send to friends</span>
      <span class="ibtn glass">${I("min", "ico sm")}</span>
      <div class="wc"><span>—</span><span>☐</span><span>✕</span></div>
    </div>
  </div>
  <div class="stage">
    <div class="left">
      <div class="halo"><canvas id="halo" width="1240" height="1000"></canvas>${cov(NOW)}</div>
      <div class="meta"><div><div class="t">${nt}</div><div class="s">${na}</div></div><span class="like">${heartF()}</span></div>
      <div class="fprog"><canvas id="wave" width="760" height="60"></canvas><div class="tt num"><span id="cur">1:01</span><span>${fmt(nd)}</span></div></div>
      <div class="fctrl">${I("shuffle")}${I("prev")}<div class="pp">${I("pause")}</div>${I("next")}${I("repeat")}</div>
    </div>
    <div class="lyrics"><div class="roll" id="roll">${LYRICS.map(([l], i) => `<div class="ln" data-i="${i}">${l || '<span class="ins">Instrumental</span>'}</div>`).join("")}</div></div>
  </div>
  <div class="src">${I("lyrics", "ico sm")}Synced word by word · Better Lyrics, LRCLIB</div>
  ${appearance("full")}
  <div class="dock glass"><span class="on">${I("lyrics")}Lyrics</span><span>${I("queue")}Queue</span><span>${I("wave")}Visualizer</span><span id="bgbtn" ${custom ? 'class="on"' : ""}>${I("image")}Background</span></div>
</div>`;
}

document.getElementById("root").innerHTML = { home, send: home, appear: home, inbox, workshop }[SCREEN]?.() ?? full();

/* ── palette source: the playing cover, or your own background ── */
const customImg = document.getElementById("custom");
if (SCREEN === "custom") {
  customImg.src = "../../../sc-media/public/textures/stipple-night.webp";
  customImg.onload = () => { const pal = paletteOf(customImg); applyPalette(pal); document.querySelectorAll(".palette i").forEach((el, i) => (el.style.background = i ? toHex(pal.field[i - 1]) : toHex(pal.accent))); window.__ready = true; };
} else { applyPalette(paletteOf(coverCanvas[NOW])); window.__ready = true; }

/* the knobs, live */
const KNOBS = { bgblur: SCREEN === "custom" ? 4 : 14, dim: 72, react: 40, glass: 58, pblur: 30 };
let REACT = 1;
function applyKnobs() {
  const r = document.documentElement.style;
  r.setProperty("--bg-blur", KNOBS.bgblur + "px");
  r.setProperty("--veil", String(KNOBS.dim / 100));
  r.setProperty("--glass-a", String(KNOBS.glass / 100));
  r.setProperty("--blur", KNOBS.pblur + "px");
  REACT = KNOBS.react / 40; // 40% is the calm default
  document.body.classList.toggle("thin", KNOBS.glass < 40);
  document.querySelectorAll("#appear input").forEach((el) => {
    const k = el.dataset.k; el.value = KNOBS[k];
    el.style.setProperty("--p", ((KNOBS[k] - el.min) / (el.max - el.min)) * 100 + "%");
    document.querySelector(`[data-out="${k}"]`).textContent = KNOBS[k] + el.dataset.unit;
  });
}
document.querySelectorAll("#appear input").forEach((el) => el.addEventListener("input", () => { KNOBS[el.dataset.k] = Number(el.value); applyKnobs(); }));
document.getElementById("lite")?.addEventListener("click", (e) => { e.currentTarget.classList.toggle("offsw"); document.body.classList.toggle("lite"); });
for (const id of ["gear", "bgbtn"]) document.getElementById(id)?.addEventListener("click", () => document.getElementById("appear").classList.toggle("open"));
applyKnobs();
document.querySelectorAll(".appear .palette i").forEach((el, i) => { const f = window.__field || []; if (!f.length) return; el.style.background = i ? `rgb(${(f[i - 1] || f[0]).map((v) => Math.round(v * 255)).join(",")})` : getComputedStyle(document.documentElement).getPropertyValue("--accent"); });

const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

/* ── waveform ── */
const WAVE = Array.from({ length: 200 }, (_, i) => 0.22 + 0.78 * Math.abs(Math.sin(i * 0.37) * Math.cos(i * 0.11 + 1.3)) * (0.7 + 0.3 * Math.sin(i * 1.7)));
function drawWave(played) {
  const cv = document.getElementById("wave"); if (!cv) return;
  const g = cv.getContext("2d"), W = cv.width, H = cv.height, n = SCREEN === "custom" || !document.querySelector(".player") ? 100 : 170, step = W / n;
  g.clearRect(0, 0, W, H);
  const acc = css("--accent");
  for (let i = 0; i < n; i++) {
    const h = WAVE[i % WAVE.length] * H * 0.9;
    g.fillStyle = i / n < played ? acc : "rgba(255,255,255,0.16)";
    g.fillRect(i * step, (H - h) / 2, Math.max(1.5, step * 0.5), h);
  }
}

/* ── the halo: thin spectrum lines standing out of the cover's outline ── */
function roundRectPoint(u, x, y, w, h, r) {
  const sw = w - 2 * r, shh = h - 2 * r, arc = (Math.PI / 2) * r;
  let d = u * (2 * sw + 2 * shh + 4 * arc);
  const segs = [
    [sw, (s) => [x + r + s, y, 0, -1]],
    [arc, (s) => { const a = -Math.PI / 2 + s / r; return [x + w - r + Math.cos(a) * r, y + r + Math.sin(a) * r, Math.cos(a), Math.sin(a)]; }],
    [shh, (s) => [x + w, y + r + s, 1, 0]],
    [arc, (s) => { const a = s / r; return [x + w - r + Math.cos(a) * r, y + h - r + Math.sin(a) * r, Math.cos(a), Math.sin(a)]; }],
    [sw, (s) => [x + w - r - s, y + h, 0, 1]],
    [arc, (s) => { const a = Math.PI / 2 + s / r; return [x + r + Math.cos(a) * r, y + h - r + Math.sin(a) * r, Math.cos(a), Math.sin(a)]; }],
    [shh, (s) => [x, y + h - r - s, -1, 0]],
    [arc, (s) => { const a = Math.PI + s / r; return [x + r + Math.cos(a) * r, y + r + Math.sin(a) * r, Math.cos(a), Math.sin(a)]; }],
  ];
  for (const [len, f] of segs) { if (d <= len) return f(d); d -= len; }
  return segs[0][1](0);
}
function drawHalo(spec, bass, t) {
  const cv = document.getElementById("halo"); if (!cv) return;
  const g = cv.getContext("2d"), W = cv.width, H = cv.height, s = 2;
  g.clearRect(0, 0, W, H);
  const x = 170 * s, y = 110 * s, w = 280 * s, h = 280 * s, r = 8 * s, gap = 12 * s;
  // a faint light behind the cover, barely moving
  const cx = x + w / 2, cy = y + h / 2;
  const bloom = g.createRadialGradient(cx, cy, w * 0.35, cx, cy, w * 0.8);
  bloom.addColorStop(0, `rgba(${css("--accent-rgb")}, ${0.1 + bass * 0.06})`); bloom.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = bloom; g.fillRect(0, 0, W, H);
  const N = 168, acc = css("--accent-rgb");
  g.lineCap = "butt";
  for (let i = 0; i < N; i++) {
    const m = Math.abs(((i / N) * 2 + 1.0) % 2 - 1);
    const v = spec[Math.min(spec.length - 1, Math.floor(m * spec.length * 0.85))] ?? 0;
    const len = Math.min(70, 3 + v * v * 56) * s;
    const [px, py, nx, ny] = roundRectPoint(i / N, x - gap, y - gap, w + 2 * gap, h + 2 * gap, r + gap);
    g.strokeStyle = v > 0.55 ? `rgba(${acc}, ${0.55 + v * 0.35})` : `rgba(255,255,255,${0.16 + v * 0.4})`;
    g.lineWidth = 1.6 * s;
    g.beginPath(); g.moveTo(px, py); g.lineTo(px + nx * len, py + ny * len); g.stroke();
  }
}
function drawRing(spec, bass) {
  const cv = document.getElementById("ring"); if (!cv) return;
  const g = cv.getContext("2d"), W = cv.width, s = 2;
  g.clearRect(0, 0, W, W);
  const N = 64, acc = css("--accent-rgb");
  g.lineWidth = 1.4 * s;
  for (let i = 0; i < N; i++) {
    const m = Math.abs(((i / N) * 2 + 1) % 2 - 1), v = spec[Math.floor(m * spec.length * 0.8)] ?? 0;
    const [px, py, nx, ny] = roundRectPoint(i / N, 24 * s - 4 * s, 24 * s - 4 * s, 52 * s + 8 * s, 52 * s + 8 * s, 8 * s);
    const len = Math.min(9, 1 + v * v * 8) * s;
    g.strokeStyle = v > 0.55 ? `rgba(${acc}, 0.9)` : `rgba(255,255,255,${0.12 + v * 0.35})`;
    g.beginPath(); g.moveTo(px, py); g.lineTo(px + nx * len, py + ny * len); g.stroke();
  }
}

/* ── word-by-word lyrics ── */
function drawLyrics(t) {
  const roll = document.getElementById("roll"); if (!roll) return;
  const lines = [...roll.children];
  let cur = 1;
  for (let i = 1; i < LYRICS.length; i++) if (t >= LYRICS[i][1]) cur = i;
  lines.forEach((el, i) => {
    const d = Math.abs(i - cur);
    el.className = "ln" + (i === cur ? " on" : d === 1 ? " near" : d >= 2 ? " far" : "");
    if (i === cur && LYRICS[i][0]) {
      const words = LYRICS[i][0].split(" "), span = (LYRICS[i + 1]?.[1] ?? t + 2.4) - LYRICS[i][1];
      const p = Math.min(1, (t - LYRICS[i][1]) / (span * 0.88));
      const total = words.reduce((sum, w) => sum + w.length + 1, 0);
      let at = 0;
      el.innerHTML = words.map((w) => {
        const a = at / total, b = (at + w.length) / total; at += w.length + 1;
        const k = Math.max(0, Math.min(1, (p - a) / (b - a)));
        return `<span class="w" style="background-image: linear-gradient(90deg, #f4f4f6 ${k * 100}%, rgba(255,255,255,0.28) ${k * 100}%)">${w}</span>`;
      }).join(" ");
    } else if (LYRICS[i][0]) el.textContent = LYRICS[i][0];
  });
  roll.style.transform = `translateY(${230 - lines[cur].offsetTop}px)`;
}

/* ── one frame ── */
function frame(t, b, spec) {
  const rb = b.map((v) => Math.min(1.5, v * REACT));
  if (SCREEN !== "custom") drawField(t, rb);
  else customImg.style.transform = `scale(${1.04 + rb[1] * 0.01}) translate(${Math.sin(t * 0.1) * 6}px, ${Math.cos(t * 0.08) * 4}px)`;
  const dur = TRACKS[NOW][2];
  drawWave((START + t) / dur);
  const cur = document.getElementById("cur"); if (cur) cur.textContent = fmt(START + t);
  const tb = document.getElementById("tilebar"); if (tb) tb.style.width = `${((START + t) / dur) * 100}%`;
  drawHalo(spec, b[1], t);
  drawRing(spec, b[1]);
  drawLyrics(t);
  for (const id of ["eq", "eq2"]) { const eq = document.getElementById(id); if (eq) [...eq.children].forEach((el, i) => (el.style.height = `${25 + 75 * b[i + 1]}%`)); }
}

window.__frame = (f) => {
  const A = window.__AUDIO, fr = A.frames[Math.min(f, A.frames.length - 1)];
  frame(f / A.fps, fr.b, fr.s);
  return new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
};

if (!RENDER) {
  const audio = new Audio(q.get("audio") || "../../../sc-media/public/music/neko.wav");
  audio.loop = true;
  const ctx = new AudioContext(), src = ctx.createMediaElementSource(audio), an = ctx.createAnalyser();
  an.fftSize = 2048; an.smoothingTimeConstant = 0.6; src.connect(an); an.connect(ctx.destination);
  const bins = new Uint8Array(an.frequencyBinCount);
  const hzBin = (hz) => Math.min(bins.length - 1, Math.round((hz / (ctx.sampleRate / 2)) * bins.length));
  const avg = (lo, hi) => { let s = 0, c = 0; for (let i = hzBin(lo); i <= hzBin(hi); i++) { s += bins[i]; c++; } return s / Math.max(1, c) / 255; };
  const edges = Array.from({ length: 49 }, (_, i) => 40 * Math.pow(14000 / 40, i / 48));
  const sm = new Float32Array(5);
  let last = 0;
  const loop = (now) => {
    requestAnimationFrame(loop);
    if (now - last < 1000 / 30) return;
    last = now;
    an.getByteFrequencyData(bins);
    const raw = [avg(20, 60), avg(60, 250), avg(250, 500), avg(500, 4000), avg(4000, 12000)].map((v) => Math.min(1, v * 1.4));
    raw.forEach((v, i) => (sm[i] += (v - sm[i]) * (v > sm[i] ? 0.5 : 0.12)));
    frame(audio.currentTime, [...sm], edges.slice(0, -1).map((lo, i) => Math.min(1, avg(lo, edges[i + 1]) * 1.3)));
  };
  const toggle = () => { ctx.resume(); audio.paused ? audio.play() : audio.pause(); };
  document.querySelectorAll(".pp").forEach((el) => el.addEventListener("click", toggle));
  document.addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); toggle(); } });
  audio.play().catch(() => {});
  requestAnimationFrame(loop);
} else {
  window.__frame(0);
}
</script>
</body>
