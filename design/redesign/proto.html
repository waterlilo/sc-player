<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>sc player 2.0 — living prototype</title>
<!--
  The 2.0 redesign as a living prototype (not app code): ?screen=home|full|custom
  - live:   npx electron design/redesign/proto.cjs  → plays a track, everything reacts through an AnalyserNode
  - render: video.cjs calls __frame(n) with the bands precomputed by analyze.mjs (audio-data.js), frame by frame
  Background: the cover's palette poured into a slowly warping noise field (domain-warped fbm, a public technique,
  written here from scratch), drawn small and blown up blurred, swelling with the bass. Icons and accents take their
  colour from the background. Made-up tracks and generated covers only.
-->
<link rel="stylesheet" href="../../node_modules/@fontsource/onest/400.css" />
<link rel="stylesheet" href="../../node_modules/@fontsource/onest/500.css" />
<link rel="stylesheet" href="../../node_modules/@fontsource/onest/600.css" />
<link rel="stylesheet" href="../../node_modules/@fontsource/onest/700.css" />
<link rel="stylesheet" href="../../node_modules/@fontsource/onest/800.css" />
<script src="audio-data.js"></script>
<style>
  :root {
    --accent: #ff6a55; --accent-rgb: 255, 106, 85; --on-accent: #160705;
    --text: #fbf8ff; --muted: rgba(240, 236, 255, 0.62); --dim: rgba(240, 236, 255, 0.36);
    --icon: color-mix(in oklab, var(--accent) 24%, #f4f1ff);
    --glass: rgba(14, 12, 20, 0.42); --glass-hi: rgba(255, 255, 255, 0.07); --line: rgba(255, 255, 255, 0.09);
    --blur: 34px; --r: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 800px; overflow: hidden; background: #030304; }
  body { font-family: Onest, system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; font-size: 13px; }
  svg { display: block; }

  /* ── the living background ── */
  #bg { position: fixed; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); filter: blur(12px) saturate(1.2) contrast(1.08); }
  #custom { position: fixed; inset: -30px; width: calc(100% + 60px); height: calc(100% + 60px); object-fit: cover; display: none; }
  .custom #custom { display: block; }
  .custom #bg { display: none; }
  .veil { position: fixed; inset: 0; pointer-events: none;
          background: radial-gradient(120% 100% at 50% 40%, rgba(3, 3, 6, 0.18), rgba(3, 3, 6, 0.66)), linear-gradient(180deg, rgba(3,3,6,0.3), rgba(3,3,6,0.15) 30%, rgba(3,3,6,0.5)); }
  .grain { position: fixed; inset: 0; pointer-events: none; opacity: 0.07; mix-blend-mode: overlay;
           background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  .glass { background: var(--glass); backdrop-filter: blur(var(--blur)) saturate(1.4); border: 1px solid var(--line);
           box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 20px 50px rgba(0,0,0,0.25); }
  .ico { width: 18px; height: 18px; color: var(--icon); flex: none; }
  .ico.sm { width: 15px; height: 15px; }
  .acc { color: var(--accent); }

  /* ── home ── */
  .app { position: fixed; inset: 0; display: grid; grid-template-columns: 252px 1fr 300px; grid-template-rows: 46px 1fr 98px; gap: 0 10px; padding: 0 10px 10px; }
  .tb { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 9px; width: 242px; font-weight: 700; font-size: 13.5px; padding-left: 6px; }
  .mark { width: 22px; height: 22px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; box-shadow: 0 0 18px rgba(var(--accent-rgb), 0.55); }
  .mark i { width: 9px; height: 9px; border-radius: 50%; background: var(--on-accent); box-shadow: 4px -3px 0 -2px var(--on-accent); }
  .hist { display: flex; gap: 4px; }
  .hist span { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: rgba(255,255,255,0.05); }
  .search { width: 420px; height: 34px; border-radius: 12px; display: flex; align-items: center; gap: 10px; padding: 0 12px; color: var(--dim); font-size: 13px; }
  .search kbd { margin-left: auto; font: 600 11px Onest; color: var(--muted); background: rgba(255,255,255,0.07); border-radius: 6px; padding: 3px 6px; }
  .tb .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .chip { height: 30px; border-radius: 15px; display: flex; align-items: center; gap: 7px; padding: 0 12px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .dotlive { width: 7px; height: 7px; border-radius: 50%; background: #5ee38a; box-shadow: 0 0 8px #5ee38a; }
  .inbox { position: relative; width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; }
  .inbox b { position: absolute; top: -3px; right: -3px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--accent); color: var(--on-accent); font: 800 10px Onest; display: grid; place-items: center; padding: 0 4px; }
  .wc { display: flex; margin-left: 6px; }
  .wc span { width: 40px; height: 34px; display: grid; place-items: center; color: var(--muted); font-size: 12px; }

  .side { border-radius: var(--r); padding: 12px 10px; display: flex; flex-direction: column; overflow: hidden; }
  .nav { display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 12px; border-radius: 11px; color: var(--muted); font-weight: 600; font-size: 13.5px; }
  .nav.on { color: var(--text); background: rgba(255,255,255,0.09); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06); }
  .nav.on .ico { color: var(--accent); }
  .nav .n { margin-left: auto; font-size: 11.5px; color: var(--dim); font-weight: 600; }
  .nav .new { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .sect { display: flex; align-items: center; margin: 16px 12px 6px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
  .sect .ico { margin-left: auto; width: 14px; height: 14px; }
  .pin { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 8px; border-radius: 11px; }
  .pin.on { background: rgba(var(--accent-rgb), 0.13); }
  .pin img { width: 34px; height: 34px; border-radius: 8px; flex: none; }
  .pin .t { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pin.on .t { color: var(--accent); }
  .pin .s { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .eq { margin-left: auto; display: flex; align-items: flex-end; gap: 2px; height: 14px; }
  .eq i { width: 3px; border-radius: 2px; background: var(--accent); }
  .bgcard { margin-top: auto; border-radius: 14px; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .bgcard .row { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 12.5px; }
  .bgcard .row .sw { margin-left: auto; }
  .bgcard .meter { display: flex; gap: 3px; align-items: flex-end; height: 18px; }
  .bgcard .meter i { flex: 1; border-radius: 2px; background: linear-gradient(to top, var(--accent), rgba(var(--accent-rgb), 0.35)); }
  .bgcard small { color: var(--muted); font-size: 11px; }
  .sw { width: 30px; height: 18px; border-radius: 9px; background: var(--accent); position: relative; }
  .sw::after { content: ""; position: absolute; right: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--on-accent); }
  .me { display: flex; align-items: center; gap: 10px; padding: 10px 6px 0; }
  .me .av { width: 30px; height: 30px; border-radius: 50%; background: conic-gradient(from 200deg, var(--accent), #6b55c8, var(--accent)); padding: 2px; }
  .me .av i { display: block; width: 100%; height: 100%; border-radius: 50%; background: #1b1530; }
  .me .t { font-weight: 700; font-size: 13px; }
  .me .s { color: var(--muted); font-size: 11px; }
  .me .ico { margin-left: auto; }

  .main { overflow: hidden; padding: 6px 6px 0; position: relative; }
  .hello { display: flex; align-items: flex-end; gap: 14px; margin: 8px 0 14px; }
  .hello h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.025em; }
  .hello .chips { margin-left: auto; display: flex; gap: 6px; }
  .hello .chips span { height: 28px; padding: 0 12px; border-radius: 14px; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--muted); background: rgba(255,255,255,0.06); border: 1px solid var(--line); }
  .hello .chips span.on { background: var(--text); color: #0b0a10; border-color: transparent; }
  .dial { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 22px; }
  .tile { position: relative; display: flex; align-items: center; gap: 12px; height: 58px; border-radius: 14px; overflow: hidden; padding-right: 12px; background: rgba(255,255,255,0.06); border: 1px solid var(--line); backdrop-filter: blur(20px); }
  .tile img { width: 58px; height: 58px; flex: none; }
  .tile .t { font-size: 13.5px; font-weight: 700; }
  .tile .s { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .tile .pp { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(var(--accent-rgb), 0.45); }
  .tile .bar { position: absolute; left: 58px; right: 0; bottom: 0; height: 2px; background: rgba(255,255,255,0.08); }
  .tile .bar i { display: block; height: 100%; background: var(--accent); }
  .tile.on { background: rgba(var(--accent-rgb), 0.16); border-color: rgba(var(--accent-rgb), 0.35); }
  .rh { display: flex; align-items: baseline; margin: 0 0 10px; }
  .rh h2 { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
  .rh a { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 600; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
  .card { position: relative; }
  .card .cv { position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 1; box-shadow: 0 14px 30px rgba(0,0,0,0.35); }
  .card .cv img { width: 100%; height: 100%; display: block; }
  .card .cv .pp { position: absolute; right: 10px; bottom: 10px; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; box-shadow: 0 8px 22px rgba(0,0,0,0.4); opacity: 0; transform: translateY(6px); }
  .card.hover .cv .pp { opacity: 1; transform: none; }
  .card.hover .cv { outline: 2px solid rgba(var(--accent-rgb), 0.7); outline-offset: -2px; }
  .card .badge { position: absolute; left: 10px; top: 10px; font: 800 10px Onest; letter-spacing: 0.06em; padding: 4px 7px; border-radius: 7px; background: rgba(0,0,0,0.55); backdrop-filter: blur(8px); }
  .card .t { font-size: 13.5px; font-weight: 700; margin-top: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .s { font-size: 12px; color: var(--muted); margin-top: 1px; display: flex; align-items: center; gap: 6px; }
  .card .s .ico { width: 13px; height: 13px; }
  .stations { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .st { position: relative; height: 120px; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); }
  .st img { position: absolute; width: 92px; height: 92px; border-radius: 10px; box-shadow: -6px 6px 18px rgba(0,0,0,0.4); }
  .st .lb { position: absolute; left: 14px; bottom: 12px; }
  .st .lb b { display: block; font-size: 15px; font-weight: 800; }
  .st .lb span { font-size: 11.5px; color: rgba(255,255,255,0.75); }
  .st .tint { position: absolute; inset: 0; }

  .queue { border-radius: var(--r); padding: 14px 12px; display: flex; flex-direction: column; overflow: hidden; }
  .qh { display: flex; align-items: center; gap: 8px; margin: 0 4px 12px; }
  .qh b { font-size: 14px; font-weight: 800; }
  .qh .tabs { margin-left: auto; display: flex; gap: 4px; }
  .qh .tabs span { font-size: 11.5px; font-weight: 700; color: var(--muted); padding: 5px 9px; border-radius: 9px; }
  .qh .tabs span.on { color: var(--text); background: rgba(255,255,255,0.1); }
  .np { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 14px; background: rgba(var(--accent-rgb), 0.12); border: 1px solid rgba(var(--accent-rgb), 0.28); }
  .np img { width: 54px; height: 54px; border-radius: 10px; }
  .np .t { font-weight: 800; font-size: 13.5px; }
  .np .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .np .from { font-size: 10.5px; color: var(--accent); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 3px; }
  .qsub { font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); margin: 16px 6px 6px; display: flex; }
  .qsub span { margin-left: auto; letter-spacing: 0; text-transform: none; font-weight: 600; }
  .qi { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 6px; border-radius: 10px; }
  .qi.hover { background: rgba(255,255,255,0.06); }
  .qi img { width: 34px; height: 34px; border-radius: 7px; }
  .qi .t { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qi .s { font-size: 11px; color: var(--muted); }
  .qi .d { margin-left: auto; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .qi .grip { color: var(--dim); width: 14px; height: 14px; }
  .qi .tag { font: 800 9px Onest; letter-spacing: 0.06em; color: var(--accent); border: 1px solid rgba(var(--accent-rgb), 0.5); border-radius: 5px; padding: 1px 4px; margin-left: 6px; }
  .auto { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--line); }
  .auto .t { font-size: 12.5px; font-weight: 700; }
  .auto .s { font-size: 11px; color: var(--muted); }
  .auto .sw { margin-left: auto; }

  .player { grid-column: 1 / -1; border-radius: var(--r); display: grid; grid-template-columns: 330px 1fr 370px; align-items: center; padding: 0 18px 0 14px; gap: 22px; }
  .now { display: flex; align-items: center; gap: 24px; min-width: 0; padding-left: 8px; }
  .cvw { position: relative; width: 64px; height: 64px; flex: none; }
  .cvw img { position: absolute; inset: 0; width: 64px; height: 64px; border-radius: 12px; }
  .cvw canvas { position: absolute; left: -28px; top: -28px; width: 120px; height: 120px; pointer-events: none; }
  .now .t { font-size: 14.5px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .now .s { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .now .like { margin-left: 4px; color: var(--accent); filter: drop-shadow(0 0 8px rgba(var(--accent-rgb), 0.6)); }
  .mid { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .ctrl { display: flex; align-items: center; gap: 24px; }
  .ctrl .on { color: var(--accent); position: relative; }
  .ctrl .on::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); }
  .ctrl .pp .ico, .fctrl .pp .ico { color: #0b0a10; }
  .ctrl .pp { width: 44px; height: 44px; border-radius: 50%; background: var(--text); color: #0b0a10; display: grid; place-items: center; box-shadow: 0 0 0 6px rgba(255,255,255,0.06), 0 10px 26px rgba(0,0,0,0.35); }
  .prog { width: 100%; max-width: 560px; display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .prog canvas { flex: 1; min-width: 0; width: 100%; height: 30px; }
  .rt { display: flex; justify-content: flex-end; align-items: center; gap: 13px; }
  .rt .on { color: var(--accent); }
  .vol { display: flex; align-items: center; gap: 8px; }
  .vol .track { width: 76px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.15); position: relative; }
  .vol .track i { position: absolute; left: 0; top: 0; bottom: 0; width: 66%; border-radius: 2px; background: var(--text); }
  .vol .track b { position: absolute; left: 66%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--text); box-shadow: 0 0 0 4px rgba(var(--accent-rgb), 0.25); }
  .lvl { display: flex; gap: 2px; align-items: flex-end; height: 16px; }
  .lvl i { width: 3px; border-radius: 1px; background: var(--accent); }

  /* ── workshop ── */
  .pillnew { margin-left: auto; font: 800 9.5px Onest; letter-spacing: 0.06em; color: var(--on-accent); background: var(--accent); border-radius: 6px; padding: 2px 6px; }
  .app.ws { grid-template-columns: 252px 1fr 340px; }
  .wsh { display: flex; align-items: flex-end; gap: 14px; margin: 8px 0 6px; }
  .wsh h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.025em; }
  .wsh p { color: var(--muted); font-size: 13px; margin-top: 4px; max-width: 430px; line-height: 1.4; }
  .wsh .make { margin-left: auto; height: 36px; padding: 0 16px; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: 13px; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px rgba(var(--accent-rgb), 0.35); white-space: nowrap; }
  .wsh .make .ico { color: var(--on-accent); }
  .wstabs { display: flex; align-items: center; gap: 4px; margin: 14px 0 12px; }
  .wstabs span { height: 30px; padding: 0 11px; border-radius: 10px; display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
  .wstabs span.on { background: rgba(255,255,255,0.1); color: var(--text); }
  .wstabs span b { font-size: 10.5px; color: var(--dim); }
  .wstabs .chips { margin-left: auto; display: flex; gap: 5px; }
  .wstabs .chips span { height: 26px; padding: 0 9px; font-size: 11.5px; border: 1px solid var(--line); background: rgba(255,255,255,0.04); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .th { border-radius: 16px; padding: 7px 7px 10px; background: rgba(255,255,255,0.045); border: 1px solid var(--line); }
  .th.sel { background: rgba(var(--accent-rgb), 0.14); border-color: rgba(var(--accent-rgb), 0.5); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.12); }
  .th .t { font-weight: 800; font-size: 13px; margin: 9px 4px 0; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .th .t .off { font: 800 8.5px Onest; letter-spacing: 0.06em; color: var(--accent); border: 1px solid rgba(var(--accent-rgb), 0.5); border-radius: 5px; padding: 1px 4px; }
  .th .by { display: flex; align-items: center; gap: 6px; margin: 4px 4px 0; font-size: 11px; color: var(--muted); }
  .th .by i { width: 13px; height: 13px; border-radius: 50%; flex: none; }
  .th .by .nums { margin-left: auto; display: flex; gap: 8px; color: var(--dim); font-weight: 600; }
  .th .by .nums span { display: flex; align-items: center; gap: 3px; }
  .th .by .ico { width: 11px; height: 11px; color: var(--dim); }
  /* a theme's preview: a tiny window with its background, its glass and its accent */
  .pv { position: relative; aspect-ratio: 16 / 9.4; border-radius: 11px; overflow: hidden; }
  .pv .bgl { position: absolute; inset: 0; }
  .pv .sd { position: absolute; left: 5%; top: 9%; bottom: 25%; width: 18%; border-radius: 6px; padding-top: 2px; }
  .pv .sd i { display: block; height: 4px; border-radius: 3px; margin: 8px 7px 0; background: currentColor; opacity: 0.35; }
  .pv .sd i:first-child { opacity: 1; background: var(--pa); }
  .pv .mn { position: absolute; left: 27%; right: 5%; top: 11%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6%; }
  .pv .mn b { aspect-ratio: 1; border-radius: 5px; background-size: cover; }
  .pv .pl { position: absolute; left: 5%; right: 5%; bottom: 7%; height: 13%; border-radius: 6px; display: flex; align-items: center; gap: 5%; padding: 0 3%; }
  .pv .pl .c { width: 8%; aspect-ratio: 1; border-radius: 3px; background-size: cover; }
  .pv .pl .w { flex: 1; height: 26%; border-radius: 3px; background: linear-gradient(90deg, var(--pa) 42%, rgba(127,127,127,0.35) 42%); }
  .pv .pl .d { width: 6%; aspect-ratio: 1; border-radius: 50%; background: var(--pa); }
  .pv .tag { position: absolute; right: 6px; top: 6px; font: 800 8.5px Onest; letter-spacing: 0.08em; padding: 3px 6px; border-radius: 6px; background: rgba(0,0,0,0.55); color: #fff; backdrop-filter: blur(6px); }
  .pv .live { position: absolute; left: 6px; top: 6px; display: flex; align-items: flex-end; gap: 2px; height: 16px; padding: 3px 5px; border-radius: 6px; background: rgba(0,0,0,0.45); }
  .pv .live i { width: 2px; border-radius: 1px; background: #fff; }
  .det { border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; overflow: hidden; }
  .det .pv { aspect-ratio: 16 / 10; border-radius: 14px; }
  .det h3 { font-size: 20px; font-weight: 800; letter-spacing: -0.015em; margin: 14px 2px 0; }
  .det .by { display: flex; align-items: center; gap: 8px; margin: 6px 2px 0; font-size: 12.5px; color: var(--muted); }

/* ── the liquid field (WebGL) ── */
const bg = document.getElementById("bg");
const gl = bg.getContext("webgl", { preserveDrawingBuffer: true, antialias: false });
bg.width = 264; bg.height = 172;
const VS = "attribute vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }";
const FS = `precision highp float;
uniform vec2 res; uniform float t; uniform vec4 band; uniform float high;
uniform vec3 c0, c1, c2, c3, c4;
float hash(vec2 p){ p = fract(p * vec2(443.897, 441.423)); p += dot(p, p.yx + 19.19); return fract((p.x + p.y) * p.x); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * f * (f * (f * 6. - 15.) + 10.);
  return mix(mix(hash(i), hash(i + vec2(1., 0.)), u.x), mix(hash(i + vec2(0., 1.)), hash(i + vec2(1., 1.)), u.x), u.y); }
float fbm(vec2 p){ float a = .5, s = 0.; mat2 m = mat2(1.6, 1.2, -1.2, 1.6); for (int i = 0; i < 5; i++){ s += a * noise(p); p = m * p; a *= .5; } return s; }
void main(){
  vec2 uv = (gl_FragCoord.xy - .5 * res) / res.y;
  float slow = t * .055;
  vec2 q = vec2(fbm(uv * 1.35 + vec2(0., slow)), fbm(uv * 1.35 + vec2(3.1, -slow * 1.3) + band.x * .35));
  float k = 2.4 + band.y * 0.9;
  vec2 r = vec2(fbm(uv * 1.15 + k * q + vec2(1.7, 9.2) + slow * .7 + band.z * .22),
                fbm(uv * 1.15 + k * q + vec2(8.3, 2.8) - slow * .5 + band.w * .28));
  float f = fbm(uv * 1.25 + (2.2 + band.y * 0.6) * r);
  vec3 col = mix(c0, c1, smoothstep(.28, .66, f));
  col = mix(col, c2, smoothstep(.45, .86, r.x));
  col = mix(col, c3, smoothstep(.52, .9, q.y) * .85);
  col = mix(col, c4, smoothstep(.6, .95, f * r.y * 1.7) * .75);
  col += smoothstep(.045, .0, abs(f - .56)) * (.08 + high * .18) * .5;
  // calm: two-thirds of the colour, about half the light; the bass lifts it only a little
  float lum = dot(col, vec3(.3, .59, .11));
  col = mix(vec3(lum), col, .62);
  col *= .46 + .14 * band.y;
  float v = smoothstep(1.3, .2, length(uv * vec2(.82, 1.)));
  col = mix(vec3(.012, .011, .018), col, .2 + .55 * v);
  gl_FragColor = vec4(col, 1.);
}`;
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = (n) => gl.getUniformLocation(prog, n);
function drawField(t, b) {
  gl.viewport(0, 0, bg.width, bg.height);
  gl.uniform2f(U("res"), bg.width, bg.height);
  gl.uniform1f(U("t"), t);
  gl.uniform4f(U("band"), b[0], b[1], b[2], b[3]);
  gl.uniform1f(U("high"), b[4]);
  (window.__field || []).forEach((c, i) => gl.uniform3f(U("c" + i), c[0], c[1], c[2]));
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

  for (let i = 0; i < n; i++) {
    const h = WAVE[i % WAVE.length] * H * 0.92, x = i * step;
    const on = i / n < played;
    g.fillStyle = on ? acc : "rgba(255,255,255,0.22)";
    if (on && i / n > played - 1 / n) { g.shadowColor = acc; g.shadowBlur = 10; } else g.shadowBlur = 0;
    g.beginPath(); g.roundRect(x, (H - h) / 2, Math.max(2, step * 0.55), h, 2); g.fill();
  }
}

/* ── the cover's halo: spectrum bars standing out of the cover's rounded outline ── */
function roundRectPoint(u, x, y, w, h, r) {
  // walk the outline: u in [0,1) → point and outward normal
  const straightW = w - 2 * r, straightH = h - 2 * r, arc = (Math.PI / 2) * r;
  const per = 2 * straightW + 2 * straightH + 4 * arc;
  let d = u * per;
  const segs = [
    [straightW, (s) => [x + r + s, y, 0, -1]],
    [arc, (s) => { const a = -Math.PI / 2 + s / r; return [x + w - r + Math.cos(a) * r, y + r + Math.sin(a) * r, Math.cos(a), Math.sin(a)]; }],
    [straightH, (s) => [x + w, y + r + s, 1, 0]],
    [arc, (s) => { const a = s / r; return [x + w - r + Math.cos(a) * r, y + h - r + Math.sin(a) * r, Math.cos(a), Math.sin(a)]; }],
    [straightW, (s) => [x + w - r - s, y + h, 0, 1]],
    [arc, (s) => { const a = Math.PI / 2 + s / r; return [x + r + Math.cos(a) * r, y + h - r + Math.sin(a) * r, Math.cos(a), Math.sin(a)]; }],
    [straightH, (s) => [x, y + h - r - s, -1, 0]],
    [arc, (s) => { const a = Math.PI + s / r; return [x + r + Math.cos(a) * r, y + r + Math.sin(a) * r, Math.cos(a), Math.sin(a)]; }],
  ];
  for (const [len, f] of segs) { if (d <= len) return f(d); d -= len; }
  return segs[0][1](0);
}
function drawHalo(spec, bass, t) {
  const cv = document.getElementById("halo"); if (!cv) return;
  const g = cv.getContext("2d"), W = cv.width, H = cv.height, s = 2;
  g.clearRect(0, 0, W, H);
  const acc = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
  // cover box in canvas pixels
  const x = 170 * s, y = 110 * s, w = 300 * s, h = 300 * s, r = 26 * s;
  // a soft bloom that breathes with the bass
  const cx = x + w / 2, cy = y + h / 2;
  const bloom = g.createRadialGradient(cx, cy, w * 0.3, cx, cy, w * (0.72 + bass * 0.08));
  bloom.addColorStop(0, `rgba(${getComputedStyle(document.documentElement).getPropertyValue("--accent-rgb")}, ${0.22 + bass * 0.25})`);
  bloom.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = bloom; g.fillRect(0, 0, W, H);
  const N = 132, gap = 14 * s;
  g.lineCap = "round"; g.strokeStyle = acc; g.shadowColor = acc; g.shadowBlur = 16;
  for (let i = 0; i < N; i++) {
    const u = (i / N + t * 0.01) % 1;
    // mirrored: lows at the bottom middle, highs at the top, both sides alike
    const m = Math.abs(((i / N) * 2 + 1.0) % 2 - 1);
    const k = Math.min(spec.length - 1, Math.floor(m * spec.length * 0.85));
    const v = spec[k] ?? 0;
    const len = Math.min(78, 4 + v * v * 58 + bass * 5) * s;
    const [px, py, nx, ny] = roundRectPoint(u, x - gap, y - gap, w + 2 * gap, h + 2 * gap, r + gap);
    g.globalAlpha = 0.35 + 0.65 * Math.min(1, v * 1.2);
    g.lineWidth = 3.2 * s;
    g.beginPath(); g.moveTo(px, py); g.lineTo(px + nx * len, py + ny * len); g.stroke();
  }
  g.globalAlpha = 1; g.shadowBlur = 0;
  // a thin outline ring that wobbles with the vocal band
  g.strokeStyle = "rgba(255,255,255,0.18)"; g.lineWidth = 1.5 * s;
  g.beginPath();
  for (let i = 0; i <= 240; i++) { const [px, py, nx, ny] = roundRectPoint(i / 240, x - gap * 0.45, y - gap * 0.45, w + gap * 0.9, h + gap * 0.9, r + gap * 0.45); const o = Math.sin(i / 240 * Math.PI * 12 + t * 2) * (2 + bass * 4) * s; i ? g.lineTo(px + nx * o, py + ny * o) : g.moveTo(px + nx * o, py + ny * o); }
  g.closePath(); g.stroke();
}
/* the player bar's small cover gets a ring of the same spectrum */
function drawRing(spec, bass) {
  const cv = document.getElementById("ring"); if (!cv) return;
  const g = cv.getContext("2d"), W = cv.width, s = 2;
  g.clearRect(0, 0, W, W);
  const acc = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
  g.strokeStyle = acc; g.lineCap = "round"; g.shadowColor = acc; g.shadowBlur = 8; g.lineWidth = 2 * s;
  const N = 56;
  for (let i = 0; i < N; i++) {
    const m = Math.abs(((i / N) * 2 + 1) % 2 - 1), v = spec[Math.floor(m * spec.length * 0.8)] ?? 0;
    const [px, py, nx, ny] = roundRectPoint(i / N, 28 * s - 5 * s, 28 * s - 5 * s, 64 * s + 10 * s, 64 * s + 10 * s, 17 * s);
    const len = (1.5 + v * v * 7 + bass * 1.5) * s;
    g.globalAlpha = 0.3 + 0.7 * v;
    g.beginPath(); g.moveTo(px, py); g.lineTo(px + nx * len, py + ny * len); g.stroke();
  }
  g.globalAlpha = 1;
}

/* ── word-by-word lyrics ── */
function drawLyrics(t) {
  const roll = document.getElementById("roll"); if (!roll) return;
  const lines = [...roll.children];
  let cur = 1;
  for (let i = 1; i < LYRICS.length; i++) if (t >= LYRICS[i][1]) cur = i;
  lines.forEach((el, i) => {
    const d = Math.abs(i - cur);
    el.className = "ln" + (i === cur ? " on" : d === 1 ? " near" : d >= 2 ? " far" : "");
    el.style.transform = i === cur ? "scale(1.04)" : "scale(1)";
    if (i === cur && LYRICS[i][0]) {
      const words = LYRICS[i][0].split(" "), span = (LYRICS[i + 1]?.[1] ?? t + 2.4) - LYRICS[i][1];
      const p = Math.min(1, (t - LYRICS[i][1]) / (span * 0.88));
      const total = words.reduce((s, w) => s + w.length + 1, 0);
      let at = 0;
      el.innerHTML = words.map((w) => {
        const a = at / total, b = (at + w.length) / total; at += w.length + 1;
        const k = Math.max(0, Math.min(1, (p - a) / (b - a)));
        const glow = "";
        return `<span class="w" style="${glow} background-image: linear-gradient(90deg, #fff ${k * 100}%, rgba(255,255,255,0.3) ${k * 100}%)">${w}</span>`;
      }).join(" ");
    } else if (LYRICS[i][0]) el.textContent = LYRICS[i][0];
  });
  // keep the sung line a third of the way down
  const target = lines[cur];
  roll.style.transform = `translateY(${210 - target.offsetTop}px)`;
}

/* ── one frame ── */
function frame(t, b, spec) {
  if (SCREEN !== "custom") drawField(t, b);
  else customImg.style.transform = `scale(${1.04 + b[1] * 0.012}) translate(${Math.sin(t * 0.1) * 8}px, ${Math.cos(t * 0.08) * 6}px)`;
  const dur = TRACKS[NOW][2];
  drawWave((START + t) / dur);
  const cur = document.getElementById("cur"); if (cur) cur.textContent = fmt(START + t);
  const tb = document.getElementById("tilebar"); if (tb) tb.style.width = `${((START + t) / dur) * 100}%`;
  drawHalo(spec, b[1], t);
  drawRing(spec, b[1]);
  drawLyrics(t);
  const eq = document.getElementById("eq"); if (eq) [...eq.children].forEach((el, i) => (el.style.height = `${20 + 80 * b[i + 1]}%`));
  const meter = document.getElementById("meter"); if (meter) [...meter.children].forEach((el, i) => (el.style.height = `${12 + 88 * (spec[Math.floor((i / 14) * 40)] ?? 0)}%`));
  const lvl = document.getElementById("lvl"); if (lvl) [...lvl.children].forEach((el, i) => (el.style.height = `${15 + 85 * Math.max(0, (b[1] + b[3]) / 2 - i * 0.12)}%`));
}

/* render mode: video.cjs drives frames one by one from the precomputed analysis */
window.__frame = (f) => {
  const A = window.__AUDIO, fr = A.frames[Math.min(f, A.frames.length - 1)];
  frame(f / A.fps, fr.b, fr.s);
  return new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
};

/* live mode: a real track through an AnalyserNode */
if (!RENDER) {
  const audio = new Audio(q.get("audio") || "../../../sc-media/public/music/neko.wav");
  audio.loop = true;
  const ctx = new AudioContext(), src = ctx.createMediaElementSource(audio), an = ctx.createAnalyser();
  an.fftSize = 2048; an.smoothingTimeConstant = 0.6; src.connect(an); an.connect(ctx.destination);
  const bins = new Uint8Array(an.frequencyBinCount);
  const hzBin = (hz) => Math.min(bins.length - 1, Math.round((hz / (ctx.sampleRate / 2)) * bins.length));
  const avg = (lo, hi) => { let s = 0, c = 0; for (let i = hzBin(lo); i <= hzBin(hi); i++) { s += bins[i]; c++; } return s / Math.max(1, c) / 255; };
  const edges = Array.from({ length: 49 }, (_, i) => 40 * Math.pow(14000 / 40, i / 48));
  const sm = new Float32Array(5);
  let last = 0;
  const loop = (now) => {
    requestAnimationFrame(loop);
    if (now - last < 1000 / 30) return; // 30 fps is plenty for a background
    last = now;
    an.getByteFrequencyData(bins);
    const raw = [avg(20, 60), avg(60, 250), avg(250, 500), avg(500, 4000), avg(4000, 12000)].map((v) => Math.min(1, v * 1.4));
    raw.forEach((v, i) => (sm[i] += (v - sm[i]) * (v > sm[i] ? 0.5 : 0.12)));
    const spec = edges.slice(0, -1).map((lo, i) => Math.min(1, avg(lo, edges[i + 1]) * 1.3));
    frame(audio.currentTime, [...sm], spec);
  };
  document.addEventListener("click", () => { ctx.resume(); audio.paused ? audio.play() : audio.pause(); });
  audio.play().catch(() => {});
  requestAnimationFrame(loop);
} else {
  window.__frame(0);
}
</script>
